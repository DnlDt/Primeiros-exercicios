<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CRUD</title>
</head>
<body>
    <h1>CRUD</h1>

    <div id="form">
        <div class="container-inputs">
            <label for="input-nome">Nome</label>
            <!-- O label é para o usuario saber oq tem q digitar, aq fala para ele digitar o nome. O for serve para conectar esse texto a caixinha de digitação -->
            <input id="input-nome" type="text"> 
            <!-- input é a caixinha q aparece para digitar algo, o id é para pegar esse valor q a pessoa digita -->

        </div>
        <div class="container-inputs">
            <label for="">Altura</label>
            <input id="input-altura" type="number">
        </div>
        <div class="container-inputs">
            <label for="">Cor</label>
            <input id="input-cor" type="text">
        </div>
        <div class="container-inputs">
            <label for="">Custo</label>
            <input id="input-custo" type="number">
        </div>
        <div class="container-inputs">
            <label for="">ID</label>
            <input id="input-id" type="number">
        </div>

        <button onclick="cadastrarDino()">+</button>
        <button onclick="salvarDino()">Edita pelo id </button>
        <button onclick="excluirDino()">Apaga pelo id</button>
        <!-- apaga por completo  --> 
    </div>

  
    <div id="painel-botoes">
        <button onclick="mostrarTodos()">Mostra na tela tudo q ta dentro do array</button>
        <!-- mostra na tela tudo q ta dentro do array, se nao tiver nada dentro do array nao vai aparecer nada, tendo sempre q usar a funcao carregarDados -->
        <button onclick="testar()">Teste</button>
        <button onclick="pesquisar()">🔍</button>
        <button onclick="carregarDados()">Carrega do storage para o array</button>
        <!-- Carrega do storage para o array mas nao mostra na tela -->
    </div>
 

    <div id="painel-dinos">
        tem nada dentro
    </div>


    
    <script src="script.js"></script>
</body>
</html>
