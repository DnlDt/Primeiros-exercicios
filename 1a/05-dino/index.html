<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dino</title>
</head>
<body>
    <h1>Jogo do dino🦖<button onclick="testar()" id="btfinanca">🧙</button></h1>
    <label for="">Valor da aposta R$</label> 
    <input type="text">
    <div id="divbt">
        <button onclick="escolherdino(0)">Espinossauro</button>
        <button onclick="escolherdino(1)">T-rex</button>
        <button onclick="escolherdino(2)">Braquiossauro</button>
        <button onclick="escolherdino(3)">Velocirraptor</button>
        <button onclick="escolherdino(4)">Estegossauro</button>
        <button onclick="escolherdino(5)">Tricerátopo</button>
        <button onclick="escolherdino(6)">Anquilossauro</button>
        <button onclick="escolherdino(7)">Parassaurolofo</button>
        <button onclick="escolherdino(8)">Alossauro</button>
        <button onclick="escolherdino(9)">Carnotauro</button>
    </div>
    <h2>!! Resultado !!</h2>
    <p>Seu dino: <output id="outdinoescolhido"></output></p>
    <p>Dino sorteado: <output id="outdinosorteado"></output></p>

    <script src="script.js"></script>
</body>
</html>
