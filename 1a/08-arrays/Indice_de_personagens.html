<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>INDICE DE PERSONAGENS</title>
    <style> 
    /* style = css */
        .destaque {
            /* o ponto (.) no início de uma palavra significa que estamos criando ou estilizando uma Classe. */
            background-color: yellow;
            font-weight: bold;
            /* font weight bota o texto em negrito */
        }
        .celula {
            padding: 5px;
            margin: 2px;
            /* margem = distancia entre um elemento e outro */
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Buscar Índice de Personagem</h1>
        <div class="array-container" id="lista"></div>
        <select id="seletor"></select>
        <button onclick="buscarIndice()">Buscar Índice</button>
        <div id="resultado"></div>
    </div>

    <script>
        const personagens = [
            "Rivaldo Jesus",
            "Kowalski",
            "Genezio",
            "Waltdisney"
        ];

        const lista = document.getElementById("lista");
        const seletor = document.getElementById("seletor");

        personagens.forEach((nome, i) => {
            const celula = document.createElement("div");
            celula.className = "celula";
            celula.id = "item" + i; // Mantido sem hífen
            
            celula.innerHTML = `<span class="valor">${nome}</span> <span class="idx">[${i}]</span>`;
            lista.appendChild(celula);

            const opt = document.createElement("option");
            opt.value = nome;
            opt.textContent = nome;
            seletor.appendChild(opt);
        });

        function buscarIndice() {
            document.querySelectorAll(".celula").forEach(c => c.classList.remove("destaque"));
            
            const nomeEscolhido = seletor.value;
            const indice = personagens.indexOf(nomeEscolhido);
            
            document.getElementById("resultado").textContent = `"${nomeEscolhido}" está no índice ${indice}`;
            
            document.getElementById("item" + indice).classList.add("destaque");
        }
    </script>
</body>
</html>
