<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indice de personagens</title>
</head>
<body>
    <script>
        const personagens = ["Rivaldo Jesus", "Kowalski","Genezio","WaltDisney"];

        const lista = document.getElementById("lista")
        const seletor = document.getElementById("seletor")
        personagens.forEach((nome, i)=>{
            const celula = document.createElement("div");
            celula.className = "celular";
            celula.id ="item" = i;
            celula.innerHTML = `<span class = "valor">${nome}</span><class="idx">[${i}]</span>`
            lista.appendChild(celula);
            
            const opt = document.createElement("option");
            opt.value=nome;
        })
    </script>
    
</body>
</html>
