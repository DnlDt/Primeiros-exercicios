<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS</title>
</head>
<body>
    <!-- h1 = escrita na pagina na parte de baixo -->

    <h1>JS da aula</h1>
    <h2>Vamos brincar com CSS</h2>

     <!-- hr = linha horizontal q aparece-->
    <hr>
    <!-- onclick = quando clicar no botao vai executar a função q ta no js: calcularPrecoBrique -->
     <!-- O que ta depois da função é o nome do botão (romero brique) -->
    <button onclick="calcularPrecoBrique()">Brique</button>
    <button onclick="calcularchances()">Monika</button>
    <button onclick="verificarprovisao()">Prov capitao gancho</button>
    <button onclick="verificarIdade()">Verificar Idade</button>
    <button onclick="advinharnumero()">Random Number</button>
    <button onclick="verificardiasemana()">Dia da Semana</button>
    <button onclick="parimpar()">Par ou Impar</button>
    <button onclick="verificarmeta()">Dona bete</button>
    <!-- output é tipo um alert só q vai aparecer do lado do botão em vez de fazer o usuario clicar ok -->
    <output id="resultado">Reservado para o result </output>

    <!-- script src= arquivo q vai ser executado do js  -->
    <script src="script.js"></script>
</body>
</html>
